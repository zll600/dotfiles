name: Orders CI

on:
  push:
    branches: [main]
    paths:
      - "orders/**"
      - ".github/workflows/orders-ci.yml"
  pull_request:
    paths:
      - "orders/**"
      - ".github/workflows/orders-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/frantic1048/blend:0.3.3@sha256:4e1c3ecd730a68fd986c33c4d3a9423efc81ca13fa1a0563ce2c639e17c73c21
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: blend --version

      - name: Check orders
        run: blend check

      - name: Check order formatting
        run: blend format --check
