name: Orders CI

on:
  push:
    branches: [main]
    paths:
      - "orders/**"
      - ".github/workflows/orders-ci.yml"
  pull_request:
    paths:
      - "orders/**"
      - ".github/workflows/orders-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/frantic1048/blend:0.2.14@sha256:21d9000745aafebf02633d88f06a728d4a0e9c1fae4603add67047646b64489e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check orders
        run: blend check

      - name: Check order formatting
        run: blend format --check
