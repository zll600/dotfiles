name: Orders CI

on:
  push:
    branches: [main]
    paths:
      - "orders/**"
      - ".github/workflows/orders-ci.yml"
  pull_request:
    paths:
      - "orders/**"
      - ".github/workflows/orders-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/frantic1048/blend:0.4.5@sha256:f976da6f3c710485daa620ed6d3360adac7c6df91b7eed54fc31d26667007dcb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: blend --version

      - name: Check orders
        run: blend check

      - name: Check order formatting
        run: blend format --check
