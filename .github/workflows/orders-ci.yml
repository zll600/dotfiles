name: Orders CI

on:
  push:
    branches: [main]
    paths:
      - "orders/**"
      - ".github/workflows/orders-ci.yml"
  pull_request:
    paths:
      - "orders/**"
      - ".github/workflows/orders-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/frantic1048/blend:0.3.0@sha256:ed39c1143e0b02ff0260a52d3d0d350c56059bd2a9138fabecd9ce56f564a2b0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: blend --version

      - name: Check orders
        run: blend check

      - name: Check order formatting
        run: blend format --check
